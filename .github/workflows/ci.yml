name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }} sanitize=${{ matrix.sanitize }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        sanitize: [OFF, ON]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DHARBOR_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        shell: bash
        run: |
          set +e
          ctest --test-dir build --output-on-failure > ctest.log 2>&1
          status=$?
          cat ctest.log
          if [ "$status" -ne 0 ]; then
            # Surface the failure as an annotation so it is readable without opening the log.
            summary=$(grep -E '\*\*\*Failed|Failure|runtime error|AddressSanitizer|LeakSanitizer|SUMMARY|what\(\)|Which is|Expected|trial|seed=' ctest.log \
              | head -40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=ctest failures::${summary}"
          fi
          exit $status
